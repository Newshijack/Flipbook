/* ===== Realistic curl: finger-true page model (ported from page-flip demo 8) =====
   Page = 1D curve (tangent angle along the paper), drawn as 240 perspective strips on a canvas overlay.
   The DOM leaves stay underneath; only the moving leaf + its shadows are drawn on the overlay. */
let curN=0;const curCl=d=>{curN=Math.max(0,curN+d);$('#stage').classList.toggle('curling',curN>0)};
const CURL=(()=>{
const W=340,PAD=100,N=280,cfg={C:.5,T:.45,L:1.1,D:5,S:.7,H:1,U:.25,single:false};
const ss=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)};
const kfT=[.11,.14,.17,.20],kfG=[1.79,2.16,2.0,1.83];
function gk(t){if(t<=kfT[0])return kfG[0];for(let i=1;i<4;i++)if(t<=kfT[i]){const u=(t-kfT[i-1])/(kfT[i]-kfT[i-1]);return kfG[i-1]+(kfG[i]-kfG[i-1])*ss(u)}return kfG[3]}
function sp(t){if(!cfg.single)return{g:1,D:1,m:.35,so:0,lo:1.8,sm:1};
 const b=ss((t-.06)/.05)*(1-ss((t-.21)/.10));
 return{g:1+b*(gk(t)-1),D:1+b*1.8,m:.35+b*.1,so:b*9.3,lo:1.8+b*.2,sm:1+b*.2}}
function thetaArr(t,dep){
 const P=sp(t),w=cfg.C*W,c=-w+(W+2*w)*(cfg.single?Math.pow(t,.6):t),ds=W/N,sd=c+(.45+.5*cfg.L)*w+P.so,sg=.3*cfg.L*w*P.sm,T=new Float32Array(N);
 for(let k=0;k<N;k++){const s=(k+.5)*ds;
  T[k]=Math.PI*.5*(1-Math.tanh(3*(s-c)/(w*P.g)))-dep/Math.cosh((s-sd)/sg)+(cfg.single?P.m*dep/Math.cosh((s-sd-P.lo*sg)/sg):0)}
 return T}
function build(t,dep){
 const ds=W/N,T=thetaArr(t,dep),TH=new Float32Array(N),X=new Float32Array(N+1),Z=new Float32Array(N+1);
 for(let k=0;k<N;k++){const th=T[k];let dx=ds*Math.cos(th),dz=ds*Math.sin(th);
  if(Z[k]+dz<0){dz=-Z[k];dx=Math.sqrt(Math.max(0,ds*ds-dz*dz))}
  X[k+1]=X[k]+dx;Z[k+1]=Z[k]+dz;TH[k]=Math.atan2(dz,dx)}
 return{X,Z,TH}}
function rawMin(t,dep){const ds=W/N,T=thetaArr(t,dep);let z=0,m=0;for(let k=0;k<N;k++){z+=ds*Math.sin(T[k]);m=Math.min(m,z)}return m}
function profile(t){
 let dep=cfg.T*ss(t/.15)*sp(t).D;
 if(rawMin(t,dep)<-.01){let lo=0,hi=dep;for(let q=0;q<24;q++){const mid=(lo+hi)/2;if(rawMin(t,mid)>=-.01)lo=mid;else hi=mid}dep=lo}
 return build(t,dep)}
/* turn parameter tau is defined so the FREE EDGE moves linearly with it (= with the finger); invert measured edge position */
let etab=null,ekey='';
function eTable(){const key=cfg.single?1:0;if(key===ekey)return etab;
 const J=160,a=new Float32Array(J+1);for(let j=0;j<=J;j++)a[j]=profile(j/J).X[N];
 for(let j=1;j<=J;j++)if(a[j]>a[j-1])a[j]=a[j-1];
 ekey=key;etab=a;return a}
function tOf(tau){tau=Math.max(0,Math.min(1,tau));const a=eTable(),J=a.length-1,
 tgt=cfg.single?W*(1-tau)+cfg.U*W*tau*tau:W*(1-2*tau);
 if(tgt>=a[0])return 0;if(tgt<=a[J])return 1;
 let lo=0,hi=J;while(hi-lo>1){const m=(lo+hi)>>1;if(a[m]>tgt)lo=m;else hi=m}
 return (lo+(a[lo]-tgt)/Math.max(1e-6,a[lo]-a[hi]))/J}

 if(gold)for(let k=0;k<w*h/2500;k++){x.fillStyle='rgba(255,246,200,.7)';x.fillRect(R()*w,R()*h,1,1)}
 let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(0,0,0,.16)');g.addColorStop(.12,'rgba(0,0,0,0)');g.addColorStop(.85,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.26)');x.fillStyle=g;x.fillRect(0,0,w,h);
 g=x.createLinearGradient(side=='l'?w:0,0,side=='l'?0:w,0);g.addColorStop(0,'rgba(0,0,0,.5)');g.addColorStop(Math.min(.5,8/Math.max(w,1)+.08),'rgba(0,0,0,.08)');g.addColorStop(.85,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.28)');
 x.fillStyle=g;x.fillRect(0,0,w,h);return c}

/* real paper: ~0.1 mm per sheet on a ~250 mm page; edges are capped to 7% of the screen width per side so the book stays big */
function geo(W,H){const cb=Math.max(4,Math.round(H*.006)),oh=Math.max(4,Math.round(H*.012)),t0=H*.95*.0004*[1,2.5][BV.em],mx=(S.n/2+1)*t0,k=Math.min(1,W*.07/mx);return{cb,oh,tk:t0*k,mx:Math.round(mx*k)}}
BV.pw=(W,H,d,ratio)=>{const g=geo(W,H),side=g.mx+g.cb;return Math.max(120,Math.floor(Math.min((W*.99-2*side)/(d?2:1),(H*.97-2*g.oh)/ratio)/2)*2)};

/* board + edges sit behind the pages of the reader's own flipbook; thickness follows how many sheets are on each side */
let DK='',DB=null;
function decor(){const bk=S.book;if(!bk)return;if(!BV.on){bk.querySelectorAll('.bvd').forEach(e=>e.remove());DK='';return}
 const st=$('#stage'),g=geo(st.clientWidth,st.clientHeight),d=S.mode=='double',f=S.f,n=S.n,pw=S.pw,ph=S.ph;
 let shL,shR;if(d){shL=f>=1?f:0;shR=f>=S.max?0:(f==0?n/2+1:(n-(2*f-1))/2+1)}else{shL=Math.max(0,f)/2;shR=Math.max(0,n+1-f)/2}
 const wL=shL>0?Math.max(3,Math.round(shL*g.tk)):0,wR=shR>0?Math.max(3,Math.round(shR*g.tk)):0,x0=d&&f==0?pw:0,x1=d?(f>=S.max?pw:2*pw):pw;
 const key=[wL,wR,x0,x1,pw,ph,g.cb,g.oh,BV.gold,S.mode].join();
 if(key===DK&&DB===bk&&bk.querySelector('.bvd'))return;                 // nothing visible changed: do no work (keeps flips smooth)
 DK=key;DB=bk;bk.querySelectorAll('.bvd').forEach(e=>e.remove());
 const mk=(el,css)=>{el.className='bvd';el.style.cssText+=';position:absolute;transform:translateZ(-4px);pointer-events:none;'+css;bk.prepend(el)};
 /* DOM order matters: the board must be first (bottom), the edges after it, or the board hides them */
 if(wR)mk(drawEdge(wR,ph,'r',shR),`left:${x1}px;top:0`);
 if(wL)mk(drawEdge(wL,ph,'l',shL),`left:${x0-wL}px;top:0`);
 mk(document.createElement('div'),`left:${x0-wL-g.cb}px;top:${-g.oh}px;width:${x1-x0+wL+wR+2*g.cb}px;height:${ph+2*g.oh}px;border-radius:3px;background:linear-gradient(var(--c1,#5b3329),var(--c2,#3b1e18));box-shadow:0 0 0 1px #0007`)}

const _set=set;set=function(f,anim){const r=_set.apply(this,arguments);if(BV.on){clearTimeout(BV.dt);if(anim)BV.dt=setTimeout(decor,450);else decor()}return r};
const btns=()=>{$('#bvb').classList.toggle('act',!!BV.on);['#bvg','#bve'].forEach(x=>$(x).style.display=BV.on?'':'none');
 $('#bvg').textContent='Edge: '+(BV.gold?'Gold':'Paper');$('#bve').textContent='Edge size: '+['Real','Thick'][BV.em]};btns();
function flip(v){if(!S.b||!S.pdf)return;BV.on=v;btns();rebuild()}
$('#bvb').onclick=()=>flip(BV.on?0:1);
$('#bvg').onclick=()=>{BV.gold^=1;sv();btns();decor()};
$('#bve').onclick=()=>{BV.em=(BV.em+1)%2;sv();btns();rebuild()};
$('#bk').addEventListener('click',()=>{BV.on=0;btns()});
addEventListener('keydown',e=>{if((e.key=='b'||e.key=='B')&&S.b&&S.pdf&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&$('#rd').classList.contains('on')){e.preventDefault();flip(BV.on?0:1)}});
})();

/* ===== Mark tool cursors (added): icon cursors instead of the + sign, with a style picker ===== */
(()=>{
const CS={k:'auto'};try{CS.k=localStorage.getItem('fs_cur')||'auto'}catch(e){}
const LAB={auto:'Auto (icon per tool)',pen:'Fountain pen',hl:'Highlighter',pencil:'Pencil',brush:'Brush',dot:'Round dot (shows size)',cross:'Crosshair (+)'};
const P=(pts,fill)=>({pts,fill});
const ICON={
 pen:c=>[[P('3,29 6.9,20.1 11.9,25.1',c),P('6.9,20.1 11.9,25.1 23.9,13.1 18.9,8.1','#2f3542'),P('18.9,8.1 23.9,13.1 26.4,10.6 21.4,5.6','#c0392b')],3,29],
 hl:c=>[[P('4,28 5.7,19.9 12.1,26.3',c),P('5.7,19.9 12.1,26.3 26.3,12.1 19.9,5.7','#f1f2f6'),P('7.87,17.73 14.27,24.13 16.39,22.01 9.99,15.61',c)],4,28],
 pencil:c=>[[P('5.85,21.95 10.05,26.15 3,29','#e8c28a'),P('3,29 4.6,26.5 6.5,28.4',c),P('5.85,21.95 10.05,26.15 24.8,11.4 20.6,7.2','#f4c542'),P('20.6,7.2 24.8,11.4 26.9,9.3 22.7,5.1','#9aa5b1'),P('22.7,5.1 26.9,9.3 28.4,7.8 24.2,3.6','#e57373')],3,29],
 brush:c=>[[P('3,29 6.4,21.2 10.8,25.6',c),P('6.4,21.2 10.8,25.6 13.2,23.2 8.8,18.8','#b0b8c4'),P('8.8,18.8 13.2,23.2 27.5,8.9 23.1,4.5','#7b4a2b')],3,29],
 wand:c=>[[P('4.7,25.7 6.3,27.3 25.8,7.8 24.2,6.2','#6d4dd8'),P('5,21 6.3,25 10,26.3 6.3,27.6 5,31.5 3.7,27.6 0,26.3 3.7,25',c)],5,26],
 erase:c=>[[P('2.8,20.8 11.2,29.2 19,21.4 10.6,13','#f48fb1'),P('10.6,13 19,21.4 23.9,16.5 15.5,8.1','#4a90e2')],7,25],
 note:c=>[[P('11,3 29,3 29,17 11,17','#2a6df4'),P('11,17 18,17 5,29','#2a6df4'),P('14,7 26,7 26,9 14,9','#fff'),P('14,11 22,11 22,13 14,13','#fff')],5,29]};
const svg=(sh,col)=>{const o=sh.map(p=>`<polygon points='${p.pts}' fill='#fff' stroke='#fff' stroke-width='3.2' stroke-linejoin='round'/>`).join(''),m=sh.map(p=>`<polygon points='${p.pts}' fill='${p.fill}' stroke='#000' stroke-opacity='.55' stroke-width='.8' stroke-linejoin='round'/>`).join('');
 return `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>${o}${m}</svg>`};
const url=x=>'url("data:image/svg+xml,'+encodeURIComponent(x)+'")';
function pick(tool,k){ if(k=='cross')return null; if(tool=='note')return 'note'; if(tool=='erase')return k=='dot'?'ering':'erase';
 if(k=='dot')return 'dot'; if(k=='auto')return tool=='vanish'?'wand':'hl'; return k}
let BV_cur=function(){const tool=INK.tool,col=INK.col||'#ffe94d',key=pick(tool,CS.k);let v='crosshair';
 if(key){let u,hx,hy;
  if(key=='dot'||key=='ering'){const D=Math.max(8,Math.min(120,key=='ering'?2*(INK.w.marker*.6+8):INK.w[tool=='vanish'?'vanish':'marker'])),Z=Math.ceil(D)+6,c=Z/2;
   const e=key=='ering'?`<circle cx='${c}' cy='${c}' r='${D/2}' fill='none' stroke='#fff' stroke-width='3'/><circle cx='${c}' cy='${c}' r='${D/2}' fill='none' stroke='#000' stroke-width='1.2'/>`:`<circle cx='${c}' cy='${c}' r='${D/2}' fill='${col}' fill-opacity='.45' stroke='#fff' stroke-width='3'/><circle cx='${c}' cy='${c}' r='${D/2}' fill='none' stroke='#000' stroke-opacity='.7' stroke-width='1'/>`;
   u=url(`<svg xmlns='http://www.w3.org/2000/svg' width='${Z}' height='${Z}' viewBox='0 0 ${Z} ${Z}'>${e}</svg>`);hx=hy=Math.round(c)}
  else{const [sh,x,y]=ICON[key](col);u=url(svg(sh,col));hx=x;hy=y}
  v=`${u} ${hx} ${hy}, crosshair`}
 let st=document.getElementById('curst');if(!st){st=document.createElement('style');st.id='curst';document.head.append(st)}
 st.textContent=`#stage.inking,#stage.inking *{cursor:${v}!important}`};
const addSel=()=>{const b=$('#inkbar');if(!b||b.querySelector('#ikcur'))return;const l=document.createElement('label');l.innerHTML='Cursor <select id="ikcur">'+Object.keys(LAB).map(k=>`<option value="${k}">${LAB[k]}</option>`).join('')+'</select>';
 b.insertBefore(l,b.querySelector('#iku'));const se=l.querySelector('select');se.value=CS.k;se.onchange=()=>{CS.k=se.value;try{localStorage.setItem('fs_cur',CS.k)}catch(e){}BV_cur()}};
const _is=inkSync;inkSync=function(){const r=_is.apply(this,arguments);addSel();BV_cur();return r};
document.addEventListener('input',e=>{if(e.target&&(e.target.id=='ikw'||e.target.id=='ikc'))BV_cur()});
window.BVCUR={icons:ICON,svg,CS,LAB};
})();
